version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Minor and patch updates arrive as a single grouped PR that CI verifies end to
  # end. Majors are deliberately left out of the group so they land as individual
  # PRs — a framework major needs its upgrade guide read, not a rubber stamp.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # vite-plus is pinned exactly and an upgrade needs `vp migrate` (it rewrites
      # the test imports and the `vite` alias), so it is bumped by hand. See
      # .ai/rules/package-json.md.
      - dependency-name: "vite-plus"

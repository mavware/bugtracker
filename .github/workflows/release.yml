name: release

# Publishes @mavware/bug-surveillance to npm when a version tag is pushed:
#
#   npm version patch --workspace packages/surveillance
#   git push && git push --tags
#
# Needs an NPM_TOKEN secret holding an npm automation token. The id-token
# permission is what lets npm attach provenance, tying the published tarball to
# this commit and this workflow run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Skipped on a manual run, where the ref is a branch rather than a tag.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./packages/surveillance/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

      - name: Typecheck the published declarations
        run: npm run typecheck --workspace packages/surveillance

      # Vitest boots Vite in serve mode, and laravel-vite-plugin refuses to leave
      # its build path whenever CI is set — a guard meant for HMR servers, not for
      # a test run. The bypass is the plugin's own escape hatch for this.
      - name: Run tests
        run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Confirm what would ship
        run: npm pack --dry-run --workspace packages/surveillance

      - name: Publish
        run: npm publish --workspace packages/surveillance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

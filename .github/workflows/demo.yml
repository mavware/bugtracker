name: demo

# Publishes packages/demo to GitHub Pages. The site is static: the library runs
# entirely in the visitor's browser, so there is nothing to deploy but files.
# Pages must be set to "GitHub Actions" as its source in the repository settings.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest boots Vite in serve mode, and laravel-vite-plugin refuses to leave
      # its build path whenever CI is set — a guard meant for HMR servers, not for
      # a test run. The bypass is the plugin's own escape hatch for this.
      - name: Run tests
        run: npm test
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Build the demo
        run: npm run build --workspace packages/demo

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/demo/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

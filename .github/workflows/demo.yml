name: demo

# Publishes packages/demo to GitHub Pages. The site is static: the library runs
# entirely in the visitor's browser, so there is nothing to deploy but files.
# Pages must be set to "GitHub Actions" as its source in the repository settings.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the library and the demo
        run: npx vitest run packages

      - name: Build the demo
        run: npm run build --workspace packages/demo

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
